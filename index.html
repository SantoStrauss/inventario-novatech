<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario NovaTech - Productos</title>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    .form-container { margin-top: 30px; padding: 15px; border: 1px solid #ccc; max-width: 400px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 6px; box-sizing: border-box; }
    .oculto { display: none; }
  </style>
</head>
<body>

  <h1>Lista de Productos</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-productos"></tbody>
  </table>

  <!-- Formulario para editar -->
  <div id="contenedor-formulario" class="form-container oculto">
    <h3>Editar Producto</h3>
    <form id="form-editar" onsubmit="guardarCambios(event)">
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label for="edit-nombre">Nombre:</label>
        <input type="text" id="edit-nombre" required>
      </div>

      <div class="form-group">
        <label for="edit-precio">Precio:</label>
        <input type="number" id="edit-precio" step="0.01" required>
      </div>

      <div class="form-group">
        <label for="edit-stock">Stock:</label>
        <input type="number" id="edit-stock" required>
      </div>

      <button type="submit">Guardar Cambios</button>
      <button type="button" onclick="cancelarEdicion()">Cancelar</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
